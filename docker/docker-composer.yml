version: "3.4"

services:

  livereload:
    build:
      context: ".."
      dockerfile: ./docker/go/Dockerfile
    container_name: container-golang
    image: app-go
    environment:
      - ENV=development
    ports:
      - "9000:9000"
    volumes:
      - ../:/app
    networks:
      - service-go


networks:
  service-go:
    driver: bridge

